[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "google-adk>=2.14.1",
    "google-auth>=2.38.0",
    "google-cloud-storage>=3.17.1",
    "google-cloud-tasks>=2.19.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
